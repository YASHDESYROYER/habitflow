<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HabitFlow — Monthly habit tracker</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{--accent:#21b881;--accent-strong:#159969;--accent-soft:#dff7ed;--bg:#f6f8f7;--surface:#fff;--surface-2:#f0f4f2;--ink:#14201b;--muted:#7b8983;--line:#e5ece8;--shadow:0 18px 50px #18382b0d;--radius:18px;color-scheme:light}
    [data-theme=dark]{--bg:#111715;--surface:#19211e;--surface-2:#202b27;--ink:#ecf5f0;--muted:#9aa9a2;--line:#2d3934;--shadow:0 18px 50px #0005;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:2px}
    .app{display:flex;min-height:100vh}.sidebar{width:244px;padding:28px 18px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800;letter-spacing:-.5px;padding:0 10px 35px}.brand-mark{width:31px;height:31px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 7px 16px color-mix(in srgb,var(--accent) 30%,transparent)}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:12px;text-align:left;color:var(--muted);font-weight:600}.nav button:hover,.nav button.active{background:var(--accent-soft);color:var(--accent-strong)}.sidebar-bottom{margin-top:auto;padding:14px 8px;color:var(--muted);font-size:12px;line-height:1.5}.theme-mini{display:flex;align-items:center;gap:8px;margin-top:15px;padding:10px;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:13px}.main{max-width:1500px;width:100%;margin:auto;padding:30px clamp(20px,4vw,52px) 88px}.mobile-nav{display:none}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:800}.page-title{font-size:30px;letter-spacing:-1.2px;margin:5px 0 0}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn,.avatar{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--surface)}.icon-btn:hover{border-color:var(--accent);color:var(--accent)}.avatar{background:var(--accent);color:#fff;font-weight:800;border:0}
    .month-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px}.month-switch{display:flex;align-items:center;gap:13px}.month-switch h2{font-size:20px;margin:0;min-width:170px;text-align:center;letter-spacing:-.5px}.chev{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center}.chev:hover{color:var(--accent);border-color:var(--accent)}.today-btn,.primary{background:var(--accent);color:#fff;border-radius:11px;padding:10px 15px;font-weight:700;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 20%,transparent)}.today-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:none}.today-btn:hover{border-color:var(--accent);color:var(--accent)}
    .stats{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:13px;margin-bottom:25px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}.stat-main{display:flex;align-items:center;gap:15px}.ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 78%,var(--surface-2) 0)}.ring:after{content:"";width:44px;height:44px;border-radius:50%;background:var(--surface);position:absolute}.ring span{position:relative;z-index:1;font-weight:800;font-size:13px}.stat-label{color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}.stat-value{font-weight:800;font-size:22px;letter-spacing:-.5px}.stat-sub{color:var(--muted);font-size:12px;margin-top:3px}
    .section-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.grid-card{overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.card-head h3{margin:0;font-size:16px}.card-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.legend{display:flex;gap:15px;color:var(--muted);font-size:12px}.legend span{display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}.dot.empty{background:var(--surface-2);border:1px solid var(--line)}
    .grid-scroll{overflow-x:auto}.habit-grid{min-width:920px}.grid-row{display:grid;grid-template-columns:250px repeat(31, minmax(26px,1fr));align-items:center;min-height:64px;border-bottom:1px solid var(--line)}.grid-row:last-child{border-bottom:0}.habit-grid .grid-row>div{padding:7px 4px;text-align:center}.grid-row.header{min-height:48px;background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:800}.grid-row.header>div:first-child{text-align:left;padding-left:22px;position:sticky;left:0;background:var(--surface-2);z-index:3}.day-head.weekend{color:var(--accent-strong)}.habit-info{display:flex;align-items:center;gap:11px;text-align:left!important;padding-left:22px!important;position:sticky;left:0;background:var(--surface);z-index:2}.habit-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0}.habit-name{font-weight:750;font-size:13px;white-space:nowrap}.habit-meta{display:flex;gap:7px;color:var(--muted);font-size:10px;margin-top:3px}.habit-meta b{color:var(--accent-strong)}.cell{width:25px;height:25px;margin:auto;border:1px solid var(--line);border-radius:8px;background:transparent;transition:.18s transform,.18s background,.18s box-shadow}.cell:hover{transform:scale(1.12);border-color:var(--accent)}.cell.done{background:var(--habit-color,var(--accent));border-color:var(--habit-color,var(--accent));box-shadow:0 4px 9px color-mix(in srgb,var(--habit-color,var(--accent)) 25%,transparent);color:#fff}.cell.done:after{content:"✓";font-size:13px;font-weight:900}.cell.today{outline:2px solid var(--accent);outline-offset:2px}.row-actions{display:flex;gap:4px;opacity:0}.grid-row:hover .row-actions{opacity:1}.row-actions button{width:26px;height:26px;border-radius:7px;color:var(--muted)}.row-actions button:hover{background:var(--surface-2);color:var(--accent)}
    .below-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.summary-card,.goals-card{padding:21px}.summary-card h3,.goals-card h3{margin:0 0 17px;font-size:16px}.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summary-stat{padding:13px;border-radius:13px;background:var(--surface-2)}.summary-stat strong{display:block;font-size:17px;margin-top:7px}.summary-stat small{color:var(--muted)}.chart{height:100px;display:flex;align-items:end;gap:7px;padding:10px 0 0}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}.bar{width:100%;max-width:18px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:5px}.bar-wrap small{color:var(--muted);font-size:9px}.goal{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.goal:last-of-type{border:0}.goal input{accent-color:var(--accent);width:17px;height:17px}.goal.done{text-decoration:line-through;color:var(--muted)}.goal-add{display:flex;gap:7px;margin-top:12px}.goal-add input,.form-field input,.form-field select{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 11px;width:100%;outline:0}.goal-add button{color:var(--accent);font-weight:800;padding:0 8px}
    .view{display:none}.view.active{display:block}.page-copy{color:var(--muted);margin-top:-17px;margin-bottom:24px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tile{padding:20px}.tile h3{margin:0 0 5px;font-size:14px}.tile .big{font-size:30px;font-weight:800}.progress{height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:13px}.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit}.calendar-layout{display:grid;grid-template-columns:270px 1fr;gap:18px}.habit-list{padding:10px}.habit-select{display:flex;align-items:center;gap:10px;padding:12px;border-radius:11px;width:100%;text-align:left}.habit-select.active,.habit-select:hover{background:var(--accent-soft)}.history{padding:24px}.history h3{margin-top:0}.history-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.history-day{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:11px}.history-day.done{background:var(--habit-color,var(--accent));color:#fff}.history-day.missed{border:1px dashed #e7a1a1}.settings-list{max-width:760px}.setting{display:flex;justify-content:space-between;align-items:center;padding:19px 0;border-bottom:1px solid var(--line)}.setting h4{margin:0 0 4px}.setting p{margin:0;color:var(--muted);font-size:12px}.select{padding:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px}.switch{width:43px;height:24px;border-radius:20px;background:var(--surface-2);padding:3px}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(19px);background:#fff}
    .modal-backdrop{position:fixed;inset:0;background:#10251c66;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;width:min(500px,100%);padding:25px;box-shadow:0 30px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:start}.modal h2{margin:0;font-size:21px}.close{color:var(--muted);font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:23px 0}.form-field{display:grid;gap:7px}.form-field.full{grid-column:1/-1}.form-field label{font-size:12px;font-weight:700;color:var(--muted)}.icons,.colors{display:flex;flex-wrap:wrap;gap:7px}.icon-choice,.color-choice{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center}.icon-choice.selected,.color-choice.selected{outline:2px solid var(--accent);outline-offset:2px}.color-choice{border-radius:50%}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.secondary{border:1px solid var(--line);padding:10px 15px;border-radius:11px;font-weight:700}.secondary:hover{border-color:var(--accent);color:var(--accent)}
    .theme-panel{position:fixed;right:20px;top:72px;width:270px;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 20px 50px #0002;z-index:5;display:none}.theme-panel.open{display:block}.theme-panel h3{margin:0 0 15px}.theme-options{display:flex;gap:7px;flex-wrap:wrap}.theme-color{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line)}.theme-color.selected{outline:2px solid var(--ink)}.mode-options{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:17px}.mode-options button{border:1px solid var(--line);border-radius:8px;padding:8px 3px;color:var(--muted);font-size:11px}.mode-options button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:700}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.stat-main{justify-content:flex-start}.below-grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:720px){.sidebar{display:none}.main{padding:22px 15px 83px}.topbar{margin-bottom:22px}.page-title{font-size:25px}.top-actions .icon-btn{display:none}.mobile-nav{display:flex;position:fixed;z-index:8;bottom:0;left:0;right:0;height:66px;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:7px 5px}.mobile-nav button{display:grid;gap:3px;place-items:center;color:var(--muted);font-size:10px}.mobile-nav button.active{color:var(--accent)}.mobile-nav i{font-style:normal}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat:first-child{grid-column:1/-1}.month-head{align-items:flex-end}.month-switch h2{min-width:130px;font-size:17px}.legend{display:none}.card-head{padding:16px}.habit-grid{min-width:1080px}.habit-info{padding-left:15px!important}.summary-stats{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:1fr}.calendar-layout{grid-template-columns:1fr}.habit-list{display:flex;overflow:auto;gap:6px}.habit-select{min-width:130px}.history-grid{gap:5px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><i data-lucide="check" width="19"></i></span>HabitFlow</div>
    <nav class="nav" id="side-nav"></nav>
    <div class="sidebar-bottom">Small steps, beautifully tracked.<button class="theme-mini" id="theme-button"><i data-lucide="palette" width="15"></i> Customize theme <span style="margin-left:auto">›</span></button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><div class="eyebrow" id="eyebrow">Thursday, September 17</div><h1 class="page-title" id="page-title">Good morning, Alex</h1></div><div class="top-actions"><button class="icon-btn" id="theme-button-top" aria-label="Theme"><i data-lucide="sun-moon" width="18"></i></button><button class="avatar">A</button></div></header>
    <section class="view active" id="dashboard-view"></section>
    <section class="view" id="habits-view"></section>
    <section class="view" id="calendar-view"></section>
    <section class="view" id="statistics-view"></section>
    <section class="view" id="settings-view"></section>
  </main>
  <nav class="mobile-nav" id="mobile-nav"></nav>
</div>
<div class="theme-panel" id="theme-panel"><h3>Make it yours</h3><div class="eyebrow">Accent color</div><div class="theme-options" id="theme-colors"></div><div class="eyebrow" style="margin-top:18px">Appearance</div><div class="mode-options" id="mode-options"><button data-mode="light">Light</button><button data-mode="dark">Dark</button><button data-mode="system">System</button></div></div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal"><div class="modal-head"><h2 id="modal-title">Add a habit</h2><button class="close" id="close-modal">×</button></div><form id="habit-form"><div class="form-grid"><div class="form-field full"><label>HABIT NAME</label><input id="habit-name" required placeholder="e.g. Drink more water"></div><div class="form-field full"><label>DESCRIPTION</label><input id="habit-description" placeholder="A little context for future you"></div><div class="form-field"><label>FREQUENCY</label><select id="habit-frequency"><option>Every day</option><option>Weekdays</option><option>Custom days</option></select></div><div class="form-field"><label>REMINDER TIME</label><input id="habit-time" type="time" value="08:00"></div><div class="form-field full"><label>CHOOSE AN ICON</label><div class="icons" id="icon-picker"></div></div><div class="form-field full"><label>HABIT COLOR</label><div class="colors" id="color-picker"></div></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancel-modal">Cancel</button><button class="primary" type="submit">Save habit</button></div></form></div></div>
<script>
const icons=['💧','🏃','📚','🧘','🎨','🎸','🥗','💻','🌱','💤'];const colors=['#21b881','#4e8df7','#9670df','#f29b4b','#ef6d83','#28a5a5','#e1b23e','#e56bba'];const navItems=[['dashboard','Dashboard','layout-dashboard'],['habits','Habits','list-checks'],['calendar','Calendar','calendar-days'],['statistics','Statistics','chart-no-axes-combined'],['settings','Settings','settings']];
const seedHabits=[{id:'water',name:'Drink Water',description:'Stay hydrated throughout the day',icon:'💧',color:'#28a5a5',frequency:'Every day',streak:7,done:[1,2,3,5,6,8,9,10,11,12,13,14,15]},{id:'exercise',name:'Exercise',description:'Move your body for 30 minutes',icon:'🏃',color:'#4e8df7',frequency:'Weekdays',streak:12,done:[1,2,4,5,6,7,8,10,11,12,14,15]},{id:'read',name:'Read 20 min',description:'Make space for a good story',icon:'📚',color:'#9670df',frequency:'Every day',streak:4,done:[2,3,4,5,7,8,9,11,12,13,15]},{id:'meditate',name:'Meditation',description:'A calm mind makes a calm day',icon:'🧘',color:'#f29b4b',frequency:'Every day',streak:3,done:[1,3,4,6,7,8,9,10,12,13,14]},{id:'study',name:'Study Spanish',description:'Practice a little every day',icon:'💻',color:'#21b881',frequency:'Weekdays',streak:8,done:[1,2,3,4,6,7,9,10,11,13,14,15]}];
const defaultState={habits:seedHabits,goals:[{id:1,text:'Complete 5 workouts',done:true},{id:2,text:'Read 100 pages',done:true},{id:3,text:'Study 10 hours',done:false}],theme:{color:'#21b881',mode:'light'}};let state;try{state=JSON.parse(localStorage.getItem('habitflow-data')||'null')||defaultState}catch{state=defaultState}let currentView='dashboard',selectedCalendar='water',editingId=null,selectedIcon=icons[0],selectedColor=colors[0],monthOffset=0;const today=17;
function save(){localStorage.setItem('habitflow-data',JSON.stringify(state))}
function setAccent(c){state.theme.color=c;document.documentElement.style.setProperty('--accent',c);const dark=state.theme.mode==='dark';document.documentElement.style.setProperty('--accent-strong',dark?'#65d9ad':c);document.documentElement.style.setProperty('--accent-soft',dark?'#183b2e':`${c}20`);save()}
function applyMode(){const m=state.theme.mode;document.documentElement.dataset.theme=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function nav(){document.getElementById('side-nav').innerHTML=navItems.map(n=>`<button data-view="${n[0]}" class="${currentView===n[0]?'active':''}"><i data-lucide="${n[2]}" width="17"></i>${n[1]}</button>`).join('');document.getElementById('mobile-nav').innerHTML=navItems.slice(0,4).map(n=>`<button data-view="${n[0]}" class="${currentView===n[0]?'active':''}"><i data-lucide="${n[2]}" width="17"></i>${n[1]}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});lucide.createIcons()}
function monthDate(){return new Date(2026,8+monthOffset,1)}
function daysInMonth(){return new Date(monthDate().getFullYear(),monthDate().getMonth()+1,0).getDate()}
function monthName(){return monthDate().toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function completion(h){return Math.round(h.done.length/daysInMonth()*100)}
function totals(){let completedToday=state.habits.filter(h=>h.done.includes(today)).length;let total=state.habits.reduce((n,h)=>n+h.done.length,0);let max=state.habits.length*daysInMonth();return {pct:Math.round(total/max*100),completedToday,total}}
function habitRow(h){let cells=Array.from({length:daysInMonth()},(_,i)=>{let d=i+1;return `<div><button class="cell ${h.done.includes(d)?'done':''} ${d===today&&monthOffset===0?'today':''}" style="--habit-color:${h.color}" data-habit="${h.id}" data-day="${d}" aria-label="${h.name}, day ${d}"></button></div>`}).join('');return `<div class="grid-row"><div class="habit-info"><span class="habit-icon" style="background:${h.color}20">${h.icon}</span><div><div class="habit-name">${h.name}</div><div class="habit-meta"><span>🔥 ${h.streak} days</span><b>${completion(h)}%</b></div></div><div class="row-actions"><button data-edit="${h.id}" title="Edit"><i data-lucide="pencil" width="13"></i></button><button data-delete="${h.id}" title="Delete"><i data-lucide="trash-2" width="13"></i></button></div></div>${cells}</div>`}
function dashboard(){let t=totals();let headers=Array.from({length:daysInMonth()},(_,i)=>`<div class="day-head ${[0,6].includes((i+monthDate().getDay())%7)?'weekend':''}">${i+1}</div>`).join('');let rows=state.habits.map(h=>habitRow(h)).join('');let chart=Array.from({length:15},(_,i)=>`<div class="bar-wrap"><div class="bar" style="height:${20+((i*17)%70)}%"></div><small>${i+1}</small></div>`).join('');return `<div class="month-head"><div class="month-switch"><button class="chev month-change" data-month="-1"><i data-lucide="chevron-left" width="17"></i></button><h2>${monthName()}</h2><button class="chev month-change" data-month="1"><i data-lucide="chevron-right" width="17"></i></button></div><button class="today-btn" id="today-month">Today</button></div><div class="stats"><div class="stat"><div class="stat-main"><div class="ring"><span>${t.pct}%</span></div><div><div class="stat-label">OVERALL COMPLETION</div><div class="stat-value">Your month so far</div><div class="stat-sub">Keep showing up — you’re doing great.</div></div></div></div><div class="stat"><div class="stat-label">TOTAL HABITS</div><div class="stat-value">${state.habits.length}</div><div class="stat-sub">Active routines</div></div><div class="stat"><div class="stat-label">COMPLETED TODAY</div><div class="stat-value">${t.completedToday}<span style="font-size:14px;color:var(--muted)"> / ${state.habits.length}</span></div><div class="stat-sub">Thursday, Sep 17</div></div><div class="stat"><div class="stat-label">CURRENT STREAK</div><div class="stat-value">🔥 12 days</div><div class="stat-sub">Personal best: 21 days</div></div></div><div class="section-card grid-card"><div class="card-head"><div><h3>Monthly habit tracker</h3><p>Tap a day to mark your progress. Every small win counts.</p></div><div class="legend"><span><i class="dot"></i>Complete</span><span><i class="dot empty"></i>To do</span></div></div><div class="grid-scroll"><div class="habit-grid"><div class="grid-row header"><div>HABIT / MONTHLY PROGRESS</div>${headers}</div>${rows}</div></div></div><div class="below-grid"><div class="section-card summary-card"><h3>Monthly summary</h3><div class="summary-stats"><div class="summary-stat"><small>Best habit</small><strong>🔥 Exercise</strong><small>86% completed</small></div><div class="summary-stat"><small>Needs a little love</small><strong>📚 Read 20 min</strong><small>73% completed</small></div><div class="summary-stat"><small>Longest streak</small><strong>21 days</strong><small>Personal record</small></div></div><div class="chart">${chart}</div></div><div class="section-card goals-card"><h3>Week 3 goals <span style="float:right;color:var(--muted);font-size:12px;font-weight:500">Sep 15–21</span></h3>${state.goals.map(g=>`<label class="goal ${g.done?'done':''}"><input type="checkbox" data-goal="${g.id}" ${g.done?'checked':''}>${g.text}</label>`).join('')}<form class="goal-add" id="goal-form"><input placeholder="Add a weekly goal..." required><button>＋</button></form></div></div>`}
function habitsView(){return `<div class="page-title" style="margin-bottom:8px">Your habits</div><p class="page-copy">Build a life you love, one repeatable action at a time.</p><div class="tiles">${state.habits.map(h=>`<div class="section-card tile"><div style="display:flex;justify-content:space-between"><span class="habit-icon" style="background:${h.color}20">${h.icon}</span><button data-edit="${h.id}" class="icon-btn" style="width:32px;height:32px"><i data-lucide="pencil" width="14"></i></button></div><h3 style="margin-top:17px">${h.name}</h3><small style="color:var(--muted)">${h.frequency} · ${h.description}</small><div class="progress"><i style="width:${completion(h)}%;background:${h.color}"></i></div><div style="display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:12px"><span>${completion(h)}% this month</span><b style="color:${h.color}">🔥 ${h.streak} day streak</b></div></div>`).join('')}</div><button class="primary" id="add-habit" style="margin-top:18px">＋ Add habit</button>`}
function calendarView(){let h=state.habits.find(x=>x.id===selectedCalendar)||state.habits[0];return `<div class="page-title" style="margin-bottom:8px">Calendar history</div><p class="page-copy">See your consistency at a glance.</p><div class="calendar-layout"><div class="section-card habit-list">${state.habits.map(x=>`<button class="habit-select ${x.id===h.id?'active':''}" data-select-habit="${x.id}"><span class="habit-icon" style="background:${x.color}20">${x.icon}</span><span><b>${x.name}</b><small style="display:block;color:var(--muted)">${completion(x)}% complete</small></span></button>`).join('')}</div><div class="section-card history"><h3>${h.icon} ${h.name} <span style="float:right;color:var(--muted);font-size:12px;font-weight:500">${monthName()}</span></h3><div class="history-grid">${Array.from({length:daysInMonth()},(_,i)=>`<div class="history-day ${h.done.includes(i+1)?'done':'missed'}" style="--habit-color:${h.color}">${i+1}</div>`).join('')}</div><p style="color:var(--muted);font-size:12px;margin-bottom:0">Filled days are complete · outlined days are missed</p></div></div>`}
function statsView(){let t=totals();return `<div class="page-title" style="margin-bottom:8px">Statistics</div><p class="page-copy">A clearer picture of the momentum you’re building.</p><div class="tiles"><div class="section-card tile"><h3>Daily completion</h3><div class="big">${t.completedToday}/${state.habits.length}</div><small style="color:var(--muted)">habits completed today</small><div class="progress"><i style="width:${t.completedToday/state.habits.length*100}%"></i></div></div><div class="section-card tile"><h3>Monthly completion</h3><div class="big">${t.pct}%</div><small style="color:var(--muted)">across all habits</small><div class="progress"><i style="width:${t.pct}%"></i></div></div><div class="section-card tile"><h3>Consistency score</h3><div class="big">84</div><small style="color:var(--muted)">Excellent — top 18%</small><div class="progress"><i style="width:84%"></i></div></div></div><div class="section-card summary-card" style="margin-top:18px"><h3>Habit performance</h3>${state.habits.map(h=>`<div style="display:flex;align-items:center;gap:11px;margin:15px 0"><span>${h.icon}</span><span style="width:105px;font-weight:700">${h.name}</span><div class="progress" style="flex:1;margin:0"><i style="width:${completion(h)}%;background:${h.color}"></i></div><b style="width:38px;text-align:right">${completion(h)}%</b></div>`).join('')}</div>`}
function settingsView(){return `<div class="page-title" style="margin-bottom:8px">Settings</div><p class="page-copy">Shape HabitFlow around your life.</p><div class="section-card summary-card settings-list"><div class="setting"><div><h4>Profile</h4><p>Alex Morgan · alex@example.com</p></div><button class="secondary">Edit profile</button></div><div class="setting"><div><h4>Appearance</h4><p>Choose a theme that feels like you</p></div><button class="secondary" id="settings-theme">Customize</button></div><div class="setting"><div><h4>Notifications</h4><p>Daily reminders and gentle nudges</p></div><button class="switch on"><i></i></button></div><div class="setting"><div><h4>Reminder preferences</h4><p>Receive reminders at your chosen habit times</p></div><button class="switch on"><i></i></button></div><div class="setting"><div><h4>Week starts on</h4><p>Used for weekly goals and summaries</p></div><select class="select"><option>Monday</option><option>Sunday</option></select></div><div class="setting"><div><h4>Data settings</h4><p>Your data is stored locally on this device</p></div><button class="secondary" id="clear-data">Reset data</button></div></div>`}
function render(){nav();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));let el=document.getElementById(currentView+'-view');el.classList.add('active');el.innerHTML=currentView==='dashboard'?dashboard():currentView==='habits'?habitsView():currentView==='calendar'?calendarView():currentView==='statistics'?statsView():settingsView();document.getElementById('page-title').textContent=currentView==='dashboard'?'Good morning, Alex':navItems.find(n=>n[0]===currentView)[1];bind();lucide.createIcons()}
function openModal(id){editingId=id||null;let h=state.habits.find(x=>x.id===id);document.getElementById('modal-title').textContent=id?'Edit habit':'Add a habit';document.getElementById('habit-name').value=h?.name||'';document.getElementById('habit-description').value=h?.description||'';document.getElementById('habit-frequency').value=h?.frequency||'Every day';document.getElementById('habit-time').value=h?.time||'08:00';selectedIcon=h?.icon||icons[0];selectedColor=h?.color||colors[0];document.getElementById('icon-picker').innerHTML=icons.map(i=>`<button type="button" class="icon-choice ${i===selectedIcon?'selected':''}" data-icon="${i}">${i}</button>`).join('');document.getElementById('color-picker').innerHTML=colors.map(c=>`<button type="button" class="color-choice ${c===selectedColor?'selected':''}" style="background:${c}" data-color="${c}"></button>`).join('');document.getElementById('modal-backdrop').classList.add('open')}
function bind(){document.querySelectorAll('.month-change').forEach(b=>b.onclick=()=>{monthOffset+=+b.dataset.month;render()});document.getElementById('today-month')?.addEventListener('click',()=>{monthOffset=0;render()});document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{let h=state.habits.find(x=>x.id===b.dataset.habit),d=+b.dataset.day;h.done=h.done.includes(d)?h.done.filter(x=>x!==d):[...h.done,d].sort((a,b)=>a-b);save();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this habit?')){state.habits=state.habits.filter(h=>h.id!==b.dataset.delete);save();render()}});document.getElementById('add-habit')?.addEventListener('click',()=>openModal());document.querySelectorAll('[data-goal]').forEach(x=>x.onchange=()=>{state.goals.find(g=>g.id==x.dataset.goal).done=x.checked;save();render()});document.getElementById('goal-form')?.addEventListener('submit',e=>{e.preventDefault();state.goals.push({id:Date.now(),text:e.target.querySelector('input').value,done:false});save();render()});document.querySelectorAll('[data-select-habit]').forEach(b=>b.onclick=()=>{selectedCalendar=b.dataset.selectHabit;render()});document.getElementById('settings-theme')?.addEventListener('click',toggleTheme);document.getElementById('clear-data')?.addEventListener('click',()=>{if(confirm('Reset all HabitFlow data?')){localStorage.removeItem('habitflow-data');state=JSON.parse(JSON.stringify(defaultState));render()}})}
document.getElementById('close-modal').onclick=document.getElementById('cancel-modal').onclick=()=>document.getElementById('modal-backdrop').classList.remove('open');document.getElementById('habit-form').onsubmit=e=>{e.preventDefault();let h=state.habits.find(x=>x.id===editingId);if(h)Object.assign(h,{name:document.getElementById('habit-name').value,description:document.getElementById('habit-description').value,frequency:document.getElementById('habit-frequency').value,time:document.getElementById('habit-time').value,icon:selectedIcon,color:selectedColor});else state.habits.push({id:Date.now().toString(),name:document.getElementById('habit-name').value,description:document.getElementById('habit-description').value,frequency:document.getElementById('habit-frequency').value,time:document.getElementById('habit-time').value,icon:selectedIcon,color:selectedColor,streak:0,done:[]});save();document.getElementById('modal-backdrop').classList.remove('open');render()};document.addEventListener('click',e=>{if(e.target.dataset.icon){selectedIcon=e.target.dataset.icon;document.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('selected',x.dataset.icon===selectedIcon))}if(e.target.dataset.color){selectedColor=e.target.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x.dataset.color===selectedColor))}});
function toggleTheme(){document.getElementById('theme-panel').classList.toggle('open')}
document.getElementById('theme-button').onclick=toggleTheme;document.getElementById('theme-button-top').onclick=toggleTheme;document.getElementById('theme-colors').innerHTML=colors.map(c=>`<button class="theme-color" style="background:${c}" data-theme-color="${c}"></button>`).join('');document.getElementById('theme-colors').onclick=e=>{if(e.target.dataset.themeColor){setAccent(e.target.dataset.themeColor);document.querySelectorAll('[data-theme-color]').forEach(x=>x.classList.toggle('selected',x.dataset.themeColor===state.theme.color))}};document.getElementById('mode-options').onclick=e=>{if(e.target.dataset.mode){state.theme.mode=e.target.dataset.mode;applyMode();save();document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.theme.mode))}};setAccent(state.theme.color);applyMode();document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.theme.mode));document.querySelectorAll('[data-theme-color]').forEach(x=>x.classList.toggle('selected',x.dataset.themeColor===state.theme.color));render();
</script>
</body>
</html>
